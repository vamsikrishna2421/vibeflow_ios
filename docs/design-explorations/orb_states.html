<!doctype html>
<html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1380px;height:900px;background:#0b0a12;overflow:hidden;
    font-family:-apple-system,"SF Pro Display","Helvetica Neue",Arial,sans-serif}
  .row{display:flex;gap:30px;padding:30px}
  .panel{position:relative;width:420px;height:840px;border-radius:34px;background:#0B0A14;
    overflow:hidden;border:1px solid rgba(255,255,255,0.06)}
  .cap{position:absolute;top:22px;left:0;right:0;text-align:center;font-size:16px;font-weight:700;
    letter-spacing:2px;color:#6E6A8A;z-index:5}
  .wm{position:absolute;top:60px;left:26px;font-size:20px;font-weight:800;color:#fff}
  .wm b{color:#7C5CFF}
  .stage{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center}
  .orbwrap{position:relative;width:230px;height:230px;display:flex;align-items:center;justify-content:center}
  .aura{position:absolute;border-radius:50%}
  .ring{position:absolute;border-radius:50%}
  .orb{position:relative;width:150px;height:150px;border-radius:50%;
    background:linear-gradient(150deg,#A855F7 0%,#7C5CFF 52%,#56B6FF 100%);display:flex;
    align-items:center;justify-content:center;box-shadow:0 14px 40px rgba(124,92,255,0.35)}
  .orb::before{content:"";position:absolute;inset:0;border-radius:50%;
    background:radial-gradient(120px 90px at 38% 28%,rgba(255,255,255,0.35),rgba(255,255,255,0) 60%)}
  .orb::after{content:"";position:absolute;inset:0;border-radius:50%;border:1px solid rgba(255,255,255,0.22)}
  .mic{z-index:2}
  .wave{display:flex;align-items:center;gap:5px;margin-top:56px;height:44px}
  .wave i{width:4px;border-radius:99px;display:block}
  .status{margin-top:40px;font-size:20px;font-weight:600;letter-spacing:-0.2px}
  .sub{margin-top:8px;font-size:13px;color:#6E6A8A}

  /* IDLE */
  .idle .aura{width:220px;height:220px;background:radial-gradient(closest-side,rgba(124,92,255,0.22),transparent 70%)}
  .idle .ring{width:196px;height:196px;border:1px solid rgba(124,92,255,0.22)}
  .idle .wave i{background:rgba(255,255,255,0.72)}
  .idle .status{color:#A7A3C2}

  /* LISTENING */
  .listen .orb{transform:scale(1.05)}
  .listen .aura{width:300px;height:300px;
    background:radial-gradient(closest-side,rgba(168,85,247,0.30),rgba(86,182,255,0.22) 45%,transparent 72%)}
  .listen .ring.inner{width:172px;height:172px;border:1px solid rgba(255,255,255,0.22)}
  .listen .ring.outer{width:250px;height:250px;border:1px solid rgba(124,92,255,0.28)}
  .listen .wave i{background:linear-gradient(180deg,#A855F7,#7C5CFF,#56B6FF)}
  .listen .status{color:#F5F4FA}

  /* PROCESSING */
  .proc .aura{width:230px;height:230px;
    background:radial-gradient(closest-side,rgba(124,92,255,0.30),rgba(67,230,193,0.12) 55%,transparent 72%)}
  .proc .segring{position:absolute;width:206px;height:206px;border-radius:50%;
    background:conic-gradient(from -40deg,#7C5CFF,#56B6FF,rgba(86,182,255,0) 70%,rgba(86,182,255,0))}
  .proc .segmask{position:absolute;width:178px;height:178px;border-radius:50%;background:#0B0A14}
  .proc .dots{display:flex;gap:8px;margin-top:56px;height:44px;align-items:center}
  .proc .dots i{width:8px;height:8px;border-radius:99px;background:#7C5CFF;display:block}
  .proc .dots i:nth-child(2){background:#6f7dff;height:16px;border-radius:6px;width:8px}
  .proc .dots i:nth-child(3){background:#56B6FF;height:22px;border-radius:6px;width:8px}
  .proc .dots i:nth-child(4){background:#43E6C1;opacity:0.9;height:14px;border-radius:6px;width:8px}
  .proc .status{color:#C9C6DE}
</style></head>
<body>
<div class="row">

  <!-- IDLE -->
  <div class="panel idle">
    <div class="cap">IDLE</div>
    <div class="wm">Vibe<b>Flow</b></div>
    <div class="stage">
      <div class="orbwrap">
        <div class="aura"></div>
        <div class="ring"></div>
        <div class="orb">
          <svg class="mic" width="30" height="46" viewBox="0 0 34 52" fill="#fff">
            <rect x="9" y="0" width="16" height="30" rx="8"/>
            <path d="M2 22 a15 15 0 0 0 30 0" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/>
            <rect x="15" y="40" width="4" height="12" rx="2"/></svg>
        </div>
      </div>
      <div class="wave"><i style="height:8px"></i><i style="height:12px"></i><i style="height:16px"></i><i style="height:22px"></i><i style="height:16px"></i><i style="height:12px"></i><i style="height:8px"></i></div>
      <div class="status">Ready</div>
      <div class="sub">slow breathe · gentle drift</div>
    </div>
  </div>

  <!-- LISTENING -->
  <div class="panel listen">
    <div class="cap">LISTENING</div>
    <div class="wm">Vibe<b>Flow</b></div>
    <div class="stage">
      <div class="orbwrap">
        <div class="aura"></div>
        <div class="ring outer"></div>
        <div class="ring inner"></div>
        <div class="orb">
          <svg class="mic" width="30" height="46" viewBox="0 0 34 52" fill="#fff">
            <rect x="9" y="0" width="16" height="30" rx="8"/>
            <path d="M2 22 a15 15 0 0 0 30 0" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/>
            <rect x="15" y="40" width="4" height="12" rx="2"/></svg>
        </div>
      </div>
      <div class="wave"><i style="height:12px"></i><i style="height:28px"></i><i style="height:38px"></i><i style="height:24px"></i><i style="height:36px"></i><i style="height:20px"></i><i style="height:10px"></i></div>
      <div class="status">Listening</div>
      <div class="sub">amplitude bars · outer pulse 1.4s</div>
    </div>
  </div>

  <!-- PROCESSING -->
  <div class="panel proc">
    <div class="cap">PROCESSING</div>
    <div class="wm">Vibe<b>Flow</b></div>
    <div class="stage">
      <div class="orbwrap">
        <div class="aura"></div>
        <div class="segring"></div>
        <div class="segmask"></div>
        <div class="orb">
          <svg class="mic" width="30" height="46" viewBox="0 0 34 52" fill="#fff">
            <rect x="9" y="0" width="16" height="30" rx="8"/>
            <path d="M2 22 a15 15 0 0 0 30 0" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/>
            <rect x="15" y="40" width="4" height="12" rx="2"/></svg>
        </div>
      </div>
      <div class="dots"><i></i><i></i><i></i><i></i></div>
      <div class="status">Formatting</div>
      <div class="sub">segmented ring rotates · cyan accent</div>
    </div>
  </div>

</div>
</body></html>
