# Empirical CPU probe: build VibeFlow for the iOS Simulator on a cloud macOS
# runner, launch it, start a dictation session via the keyboard deep-link, send it
# to the background, and log its CPU every 3s for ~10 minutes. A background CPU-spin
# (the "issue 2" the OS kills on-device) will show as sustained high CPU here even
# though the Simulator won't enforce the kill. Also streams the device log so a
# repeated throw/error loop is visible.
name: iOS Sim CPU probe

on:
  workflow_dispatch:
  push:
    tags: ['sim-probe-*']

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app && xcodebuild -version
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install JS deps
        run: npm install --no-audit --no-fund
      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods -v 1.17.0 --no-document
          cd ios && rm -f Podfile.lock && pod install

      - name: Build for the Simulator (no signing)
        run: |
          set -o pipefail
          HOSTARCH=$(uname -m)
          echo "RUNNER ARCH = $HOSTARCH  (arm64 => Expo's arm64-only XCFrameworks can load & the app can RUN)"
          # Build for the HOST arch sim so the prebuilt arm64 Expo frameworks resolve.
          xcodebuild \
            -workspace ios/VibeFlow.xcworkspace \
            -scheme VibeFlow \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath ios/build-sim \
            -destination "generic/platform=iOS Simulator" \
            ARCHS="$HOSTARCH" ONLY_ACTIVE_ARCH=YES EXCLUDED_ARCHS="" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tail -40
          echo "APP_PATH=$(ls -d ios/build-sim/Build/Products/Release-iphonesimulator/VibeFlow.app)" >> "$GITHUB_ENV"

      - name: Boot a simulator + grant permissions
        run: |
          RT=$(xcrun simctl list runtimes | grep -oE 'com.apple.CoreSimulator.SimRuntime.iOS-[0-9-]+' | tail -1)
          echo "runtime=$RT"
          UDID=$(xcrun simctl create probe-phone "iPhone 16" "$RT")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          sleep 8
          xcrun simctl privacy "$UDID" grant all com.vibeflow.dictation || true

      - name: Install + launch + start a session + background it, then probe CPU
        run: |
          set +e
          UDID="$UDID"
          xcrun simctl install "$UDID" "$APP_PATH"

          # stream the WHOLE simulator log (not just one process) so a launch crash /
          # jsi error / repeated throw is visible regardless of process name.
          xcrun simctl spawn "$UDID" log stream --level debug \
            --predicate 'senderImagePath CONTAINS "VibeFlow" OR processImagePath CONTAINS "VibeFlow" OR eventMessage CONTAINS "vibeflow" OR eventMessage CONTAINS "Hermes" OR eventMessage CONTAINS "RCT"' \
            > sim-device.log 2>&1 &
          LOGPID=$!

          # launch and CAPTURE the pid (or the crash) — simctl prints "<bundleid>: <pid>"
          LAUNCH_OUT=$(xcrun simctl launch "$UDID" com.vibeflow.dictation 2>&1)
          echo "LAUNCH: $LAUNCH_OUT"
          PID=$(echo "$LAUNCH_OUT" | grep -oE '[0-9]+$')
          echo "captured app PID = ${PID:-<none>}"
          sleep 6
          echo "alive after 6s? $(ps -p "${PID:-0}" -o pid=,comm= 2>/dev/null || echo 'NO — app is not running (launch crash?)')"

          xcrun simctl openurl "$UDID" "vibeflow://record?from=keyboard" 2>&1 || true
          sleep 5
          # background VibeFlow by foregrounding Safari
          xcrun simctl launch "$UDID" com.apple.mobilesafari 2>&1 || true

          echo "ts,cpu_pct,rss_mb" > cpu-samples.csv
          HIGH=0; MAX=0; SUM=0; N=0; DIED_AT=""
          for i in $(seq 1 140); do
            # re-resolve pid each loop in case it changed; prefer the launch pid
            P="$PID"; ps -p "${P:-0}" >/dev/null 2>&1 || P=$(pgrep -x VibeFlow | head -1)
            if [ -n "$P" ] && ps -p "$P" >/dev/null 2>&1; then
              READ=$(ps -o %cpu=,rss= -p "$P" 2>/dev/null | awk '{printf "%s,%.1f",$1,$2/1024}')
              CPU=$(echo "$READ" | cut -d, -f1); CPUI=$(printf "%.0f" "${CPU:-0}")
              echo "$(date +%s),$READ" >> cpu-samples.csv
              SUM=$((SUM+CPUI)); N=$((N+1))
              [ "$CPUI" -gt "$MAX" ] && MAX=$CPUI
              [ "$CPUI" -gt 40 ] && HIGH=$((HIGH+1))
            else
              echo "$(date +%s),GONE,0" >> cpu-samples.csv
              [ -z "$DIED_AT" ] && DIED_AT="$i"
            fi
            sleep 3
          done
          kill $LOGPID 2>/dev/null

          echo "===================== CPU PROBE SUMMARY ====================="
          echo "launch: $LAUNCH_OUT"
          [ -n "$DIED_AT" ] && echo "app process NOT found starting at sample $DIED_AT (crash or wrong pid)"
          [ "$N" -gt 0 ] && echo "live samples=$N  avg=$((SUM/N))%  max=${MAX}%  samples>40%=${HIGH}" || echo "NO live CPU samples captured"
          echo "INTERPRET: app runs + avg/max HIGH sustained -> spin reproduces. app runs + low CPU -> fixed/idle. app never runs -> launch crash."
          echo "----- CPU samples (every 10th) -----"; awk 'NR==1||NR%10==0' cpu-samples.csv
          echo "----- device-log: launch/crash/error signatures -----"
          grep -iE "crash|exception|fatal|signal|abort|terminat|jsi|hermes|assert|error|throw|AVAudio|denied" sim-device.log \
            | sed -E 's/^[0-9-]+ [0-9:.]+[^]]*] *//' | sort | uniq -c | sort -rn | head -20
          echo "----- first 30 raw device-log lines -----"; head -30 sim-device.log

      - name: Upload probe artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-probe
          path: |
            cpu-samples.csv
            sim-device.log
          if-no-files-found: ignore
