# Build the iOS app (app + keyboard + widget) on GitHub's free macOS runner and
# upload to TestFlight via fastlane — no Mac, no EAS credits, no Apple password.
# fastlane creates the distribution cert + App Store profiles for all 3 targets
# from the App Store Connect API key (App Store profiles need no registered
# devices). Secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8.
name: iOS TestFlight

on:
  workflow_dispatch:
  push:
    tags: ['ios-v*']

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install JS dependencies
        run: npm install --no-audit --no-fund
      - name: Install CocoaPods
        run: cd ios && pod install
      - name: fastlane beta (sign + build + upload)
        run: cd ios && fastlane beta
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ios/build/*.log
            ~/Library/Logs/gym/*.log
          if-no-files-found: ignore
