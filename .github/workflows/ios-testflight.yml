# Build the iOS app (app + keyboard + widget) on GitHub's free macOS runner and
# upload to TestFlight via fastlane — no Mac, no EAS credits, no Apple password.
# fastlane imports a stable Apple Distribution cert (.p12) and force-creates App
# Store profiles for all 3 targets from the App Store Connect API key (App Store
# profiles need no registered devices; manual signing avoids the dev-profile trap).
# Secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, DIST_P12_B64, DIST_P12_PW.
name: iOS TestFlight

on:
  workflow_dispatch:
  push:
    tags: ['ios-v*']

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      DIST_P12_B64: ${{ secrets.DIST_P12_B64 }}
      DIST_P12_PW: ${{ secrets.DIST_P12_PW }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.3 (newest Swift 6.2.x; Expo SDK 57 uses `weak let`)
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version
          swift --version
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install JS dependencies
        run: npm install --no-audit --no-fund
      - name: Install CocoaPods
        # Fresh-resolve pods on the runner: Expo's local podspecs evaluate
        # machine-dependently, so a Podfile.lock written on another machine can
        # checksum-mismatch here ("could not find compatible versions for
        # ExpoModulesWorklets") — with pod versions pinned by node_modules anyway,
        # dropping the lockfile is deterministic enough. CocoaPods pinned to match
        # local tooling.
        run: |
          sudo gem install cocoapods -v 1.17.0 --no-document
          cd ios && rm -f Podfile.lock && pod install
      - name: fastlane beta (sign + build + upload)
        run: cd ios && fastlane beta
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ios/build/*.log
            ~/Library/Logs/gym/*.log
          if-no-files-found: ignore
